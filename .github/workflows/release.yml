# Builds standalone one-folder bundles (PyInstaller) for Windows/Linux/macOS
# and attaches them to a GitHub Release. Triggered by pushing a tag like
# v0.1.0; workflow_dispatch builds the zips as artifacts without releasing.
# See docs/PACKAGING.md.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-24.04       # glibc 2.39 floor: users need a 2024+ distro
            name: linux-x64
          - os: macos-latest       # Apple Silicon; add an Intel runner if needed
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Fail before spending three build legs on artifacts whose metadata would
      # disagree with the tag they ship under.
      - name: Tag must match the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          pkg=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME implies version $tag, but pyproject.toml says $pkg"
            exit 1
          fi

      # Qt's offscreen plugin still links these even with no display.
      - name: Install Qt runtime libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libopengl0 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install
        run: python -m pip install .[dev] pyinstaller

      # The full suite is headless (offscreen) but the mock GTP engine is
      # POSIX-only, so gate the release on the Linux run.
      - name: Tests (Linux)
        if: runner.os == 'Linux'
        run: python -m pytest -q

      - name: Build bundle
        run: python -m PyInstaller katsura.spec --noconfirm

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/katsura -DestinationPath "dist/katsura-${{ github.ref_name }}-${{ matrix.name }}.zip"

      - name: Zip (Linux)
        if: runner.os == 'Linux'
        run: cd dist && zip -qry "katsura-${{ github.ref_name }}-${{ matrix.name }}.zip" katsura

      - name: Zip (macOS)                # ditto preserves the .app's symlinks
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Katsura.app "dist/katsura-${{ github.ref_name }}-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: katsura-${{ matrix.name }}
          path: dist/katsura-*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          draft: true              # review release notes before publishing

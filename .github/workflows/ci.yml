# Lint and test on every push and pull request. The suite is headless
# (tests/conftest.py forces Qt's offscreen platform), so it needs Qt's runtime
# libraries but no display.
#
# Linux only, deliberately: the mock GTP engine the engine tests drive uses
# select() on stdin and launches through bash, neither of which works on
# Windows. Release builds still cover all three platforms — see release.yml.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The floor from requires-python, and current. The floor leg is what
        # catches newer syntax quietly raising the real minimum.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Qt's offscreen plugin still links these even with no display.
      - name: Install Qt runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libopengl0 libxkbcommon0 libdbus-1-3 libfontconfig1

      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
